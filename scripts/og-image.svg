<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goal" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0e13"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(72 70)">
    <rect width="56" height="56" rx="13" fill="#18222d"/>
    <circle cx="28" cy="28" r="15" fill="none" stroke="#e6edf3" stroke-width="3.5"/>
    <circle cx="28" cy="28" r="5.5" fill="#34d399"/>
    <text x="76" y="38" class="sans" font-size="30" font-weight="700" fill="#e6edf3">Pitchside <tspan fill="#34d399">Live</tspan></text>
  </g>

  <!-- Headline -->
  <text x="72" y="222" class="sans" font-size="48" font-weight="700" fill="#e6edf3">Live football scores,</text>
  <text x="72" y="280" class="sans" font-size="48" font-weight="700" fill="#e6edf3">pushed over WebSockets</text>
  <text x="72" y="340" class="sans" font-size="24" fill="#8b9aab">Server-side diffing · versioned patches · Socket.io rooms</text>

  <!-- Stack chips -->
  <g class="sans" font-size="20" fill="#e6edf3">
    <rect x="72" y="386" width="96" height="40" rx="20" fill="#131b24" stroke="#233142"/>
    <text x="120" y="413" text-anchor="middle">React</text>
    <rect x="180" y="386" width="112" height="40" rx="20" fill="#131b24" stroke="#233142"/>
    <text x="236" y="413" text-anchor="middle">NestJS</text>
    <rect x="304" y="386" width="132" height="40" rx="20" fill="#131b24" stroke="#233142"/>
    <text x="370" y="413" text-anchor="middle">Socket.io</text>
    <rect x="448" y="386" width="140" height="40" rx="20" fill="#131b24" stroke="#233142"/>
    <text x="518" y="413" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Scoreboard card -->
  <g transform="translate(700 150)">
    <rect width="430" height="330" rx="20" fill="#0f151c" stroke="#18222d" stroke-width="2"/>
    <text x="28" y="44" class="sans" font-size="16" font-weight="700" fill="#8b9aab" letter-spacing="1.5">PREMIER LEAGUE</text>
    <circle cx="398" cy="39" r="6" fill="#34d399"/>

    <!-- Row 1 -->
    <g transform="translate(0 70)">
      <text x="28" y="44" class="mono" font-size="20" fill="#34d399">67'</text>
      <text x="170" y="45" class="sans" font-size="22" fill="#e6edf3" text-anchor="end">Arsenal</text>
      <rect x="186" y="16" width="92" height="42" rx="10" fill="#18222d"/>
      <text x="232" y="46" class="mono" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="middle">1–0</text>
      <text x="294" y="45" class="sans" font-size="22" fill="#e6edf3">Chelsea</text>
    </g>
    <line x1="20" x2="410" y1="146" y2="146" stroke="#18222d" stroke-width="2"/>

    <!-- Row 2 (just scored) -->
    <g transform="translate(0 150)">
      <rect x="2" y="2" width="426" height="76" fill="url(#goal)"/>
      <rect x="2" y="2" width="5" height="76" fill="#fbbf24"/>
      <text x="28" y="48" class="mono" font-size="20" fill="#34d399">81'</text>
      <text x="170" y="49" class="sans" font-size="22" font-weight="700" fill="#e6edf3" text-anchor="end">Liverpool</text>
      <rect x="186" y="20" width="92" height="42" rx="10" fill="#18222d"/>
      <text x="232" y="50" class="mono" font-size="26" font-weight="700" fill="#fbbf24" text-anchor="middle">2–2</text>
      <text x="294" y="49" class="sans" font-size="22" fill="#e6edf3">Man City</text>
    </g>
    <line x1="20" x2="410" y1="230" y2="230" stroke="#18222d" stroke-width="2"/>

    <!-- Row 3 -->
    <g transform="translate(0 234)">
      <text x="28" y="48" class="mono" font-size="20" fill="#fbbf24">HT</text>
      <text x="170" y="49" class="sans" font-size="22" fill="#e6edf3" text-anchor="end">Newcastle</text>
      <rect x="186" y="20" width="92" height="42" rx="10" fill="#18222d"/>
      <text x="232" y="50" class="mono" font-size="26" font-weight="700" fill="#e6edf3" text-anchor="middle">0–1</text>
      <text x="294" y="49" class="sans" font-size="22" fill="#e6edf3">Everton</text>
    </g>
  </g>

  <!-- Patch callout -->
  <g transform="translate(700 505)">
    <rect width="430" height="56" rx="12" fill="#131b24" stroke="#233142"/>
    <text x="22" y="35" class="mono" font-size="18" fill="#34d399">↓ match:patch</text>
    <text x="178" y="35" class="mono" font-size="18" fill="#8b9aab">LIV–MCI · score</text>
    <text x="408" y="35" class="mono" font-size="18" fill="#5b6b7c" text-anchor="end">243 B</text>
  </g>

  <text x="72" y="560" class="sans" font-size="20" fill="#5b6b7c">Real-time portfolio project · Premier League &amp; La Liga</text>
</svg>
